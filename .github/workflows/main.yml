name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt apksigner zipalign dalvik-exchange zip

      - name: Make sure the Android 34 platform is present
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-34/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34"
          fi

      - name: Build and sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar" bash build.sh

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: GoalToAction-apk
          path: build/GoalToAction-*.apk
          if-no-files-found: error
